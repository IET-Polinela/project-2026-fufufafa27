{% extends 'base.html' %}

{% block title %}Login — Smart City{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0">🔐 Login</h4>
      </div>
      <div class="card-body p-4">

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <input type="text" name="username" id="id_username"
                   class="form-control" placeholder="Masukkan username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <input type="password" name="password" id="id_password"
                   class="form-control" placeholder="Masukkan password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <hr>
        <p class="text-center mb-0 small">
          Belum punya akun?
          <a href="{% url 'register' %}">Daftar sebagai Citizen</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
