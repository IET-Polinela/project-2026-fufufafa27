<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga - Smart City Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #1a56db;
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-active: #3b82f6;
            --bg-main: #f1f5f9;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        body { background-color: var(--bg-main); font-family: 'Segoe UI', system-ui, sans-serif; }
        .spa-container { min-height: calc(100vh - 60px); }
        #sidebar { background-color: var(--sidebar-bg); min-height: calc(100vh - 60px); padding: 1rem 0; }
        #sidebar .nav-link { color: var(--sidebar-text); padding: 0.6rem 1.2rem; border-radius: 6px; margin: 2px 8px; transition: all 0.2s; font-size: 0.9rem; }
        #sidebar .nav-link:hover, #sidebar .nav-link.active { background-color: var(--sidebar-active); color: #fff; }
        #sidebar .nav-link i { width: 20px; text-align: center; }
        .sidebar-heading { color: #64748b; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 0.8rem 1.2rem 0.3rem; }
        #login-page { min-height: calc(100vh - 60px); background: linear-gradient(135deg, #1e293b 0%, #1a56db 100%); }
        .login-card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-card .card-header { background: linear-gradient(135deg, #1a56db, #3b82f6); border-radius: 16px 16px 0 0 !important; padding: 2rem; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(26,86,219,0.25); }
        .report-card { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
        .report-card .card-body { padding: 14px 16px; }
        .status-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
        .progress { height: 6px; border-radius: 4px; }
        .nav-tabs .nav-link { font-size: 0.85rem; }
        .nav-tabs .nav-link.active { font-weight: 600; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#dashboard">
                <i class="bi bi-buildings-fill me-2"></i>Smart City Portal
            </a>
            <div id="nav-menus" class="ms-auto d-flex align-items-center gap-2"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-0 spa-container" id="app-content"></main>

    <!-- ✅ TAMBAHAN LAB 12 — Bootstrap Modal Form Laporan -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="reportModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>Buat Laporan Baru
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="reportForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small"><i class="bi bi-card-heading me-1"></i>Judul Laporan</label>
                            <input type="text" id="reportTitle" class="form-control" placeholder="Contoh: Jalan Berlubang di Jl. Sudirman" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small"><i class="bi bi-grid me-1"></i>Kategori</label>
                            <select id="reportCategory" class="form-select">
                                <option value="infrastructure">Infrastruktur</option>
                                <option value="environment">Lingkungan</option>
                                <option value="public_service">Pelayanan Publik</option>
                                <option value="safety">Keamanan</option>
                                <option value="other">Lainnya</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small"><i class="bi bi-geo-alt me-1"></i>Lokasi</label>
                            <input type="text" id="reportLocation" class="form-control" placeholder="Contoh: Jl. Sudirman No. 10, Bandar Lampung">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small"><i class="bi bi-text-paragraph me-1"></i>Deskripsi</label>
                            <textarea id="reportDescription" class="form-control" rows="3" placeholder="Jelaskan detail masalah..."></textarea>
                        </div>
                        <div id="reportAlertContainer"></div>
                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-outline-secondary fw-bold px-4" id="btnDraft">
                                <i class="bi bi-floppy me-1"></i>Simpan Draft
                            </button>
                            <button type="button" class="btn btn-primary fw-bold px-4" id="btnSubmit">
                                Ajukan <i class="bi bi-send-fill ms-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
